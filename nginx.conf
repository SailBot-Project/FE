# nginx.conf
server {
    listen 80;
    server_name 54.180.152.40;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate"; 
    }

    location /static/ {
        root /usr/share/nginx/html;
    }
}